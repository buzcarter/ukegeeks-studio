<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UkeGeeks Studio</title>
  <link rel="stylesheet" href="css/song-list.css" />
  <link rel="stylesheet" href="css/dialog.css" />
</head>
<body>
  <header class="listHeader">
    <h1>UkeGeeks Studio</h1>
    <span class="listButtons">
      <button type="button" id="newSong">New Song…</button>
      <button type="button" id="openSong">Open Song…</button>
      <button type="button" id="openSongbook">Open Songbook…</button>
    </span>
  </header>

  <main>
    <p id="songbookStatus" class="status" role="status">Open a songbook: a folder of ChordPro songs (<code>*.cpm</code>). Settings (Cmd+,) can list other song file types too.</p>
    <ol id="songList" class="songList"></ol>
  </main>

  <script type="module" src="js/list.js"></script>
</body>
</html>
