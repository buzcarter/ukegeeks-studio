<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UkeGeeks Studio</title>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/wood.css" />
  <link rel="stylesheet" href="css/song-list.css" />
  <link rel="stylesheet" href="css/dialog.css" />
</head>
<body>
  <header class="listHeader woodBar">
    <h1 class="woodLogo">UkeGeeks Studio</h1>
    <span class="listButtons">
      <button type="button" id="newSong" class="woodBtn">New Song…</button>
      <button type="button" id="openSong" class="woodBtn">Open Song…</button>
      <button type="button" id="openSongbook" class="woodBtn orange">Add Songbook…</button>
    </span>
  </header>

  <div class="libraryLayout">
    <nav class="library" aria-label="Library">
      <h2 class="libraryHeading">Library</h2>
      <ul id="songbookList" class="songbookList"></ul>
      <div class="libraryButtons">
        <button type="button" id="addSongbook" class="libraryBtn" title="Add Songbook to Library…" aria-label="Add Songbook to Library…">+</button>
        <button type="button" id="removeSongbook" class="libraryBtn" title="Remove from Library (the folder stays on disk)" aria-label="Remove from Library" disabled>&minus;</button>
      </div>
    </nav>

    <main>
      <p id="songbookStatus" class="status" role="status">Add a songbook to your Library: a folder of ChordPro songs (<code>*.cpm</code>). Settings (Cmd+,) can list other song file types too.</p>
      <ol id="songList" class="songList"></ol>
    </main>
  </div>

  <script type="module" src="js/list.js"></script>
</body>
</html>
