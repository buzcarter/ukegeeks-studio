<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UkeGeeks Studio</title>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/wood.css" />
  <link rel="stylesheet" href="css/song-list.css" />
  <link rel="stylesheet" href="css/dialog.css" />
</head>
<body>
  <header class="listHeader woodBar">
    <h1 class="woodLogo">UkeGeeks Studio</h1>
    <div class="topAction">
      <button type="button" id="topActionButton" class="woodBtn orange topActionBtn" aria-expanded="false" aria-controls="topActionMenu" aria-haspopup="true" title="New, Open, Add">+</button>
      <ul id="topActionMenu" class="topActionMenu" role="menu" hidden>
        <li><button type="button" role="menuitem" data-action="new-song">New Song…</button></li>
        <li><button type="button" role="menuitem" data-action="open-song">Open Song…</button></li>
        <li><button type="button" role="menuitem" data-action="add-songbook">Add Songbook…</button></li>
      </ul>
    </div>
  </header>

  <div class="libraryLayout">
    <nav class="library" aria-label="Library">
      <h2 class="libraryHeading">Library</h2>
      <ul class="songbookList favoritesList">
        <li><button type="button" id="showFavorites" aria-current="false"><span class="favoritesIcon" aria-hidden="true">★</span> Favorites</button></li>
        <li><button type="button" id="showAll" aria-current="false"><span class="favoritesIcon" aria-hidden="true">♫</span> All Songs</button></li>
      </ul>
      <ul id="songbookList" class="songbookList"></ul>
    </nav>

    <main>
      <input type="search" id="librarySearch" class="librarySearch woodInput" placeholder="Search: title, artist or lyrics" aria-label="Search" autocomplete="off" spellcheck="false" />
      <p id="songbookStatus" class="status" role="status">Add a songbook to your Library: a folder of ChordPro songs (<code>*.cpm</code>). Settings (Cmd+,) can list other song file types too.</p>
      <ol id="songList" class="songList"></ol>
    </main>
  </div>

  <script type="module" src="js/list.js"></script>
</body>
</html>
