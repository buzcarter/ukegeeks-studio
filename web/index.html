<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UkeGeeks Studio</title>
  <link rel="stylesheet" href="css/song-list.css" />
</head>
<body>
  <header class="listHeader">
    <h1>UkeGeeks Studio</h1>
    <button type="button" id="openSongbook">Open Songbook…</button>
  </header>

  <main>
    <p id="songbookStatus" class="status" role="status">Open a songbook: a folder of ChordPro songs (<code>*.cpm</code>).</p>
    <label class="setting"><input type="checkbox" id="includeCpmTxt" /> Also list <code>.cpm.txt</code> songs (the UkeGeeks Songbook's file names)</label>
    <ol id="songList" class="songList"></ol>
  </main>

  <script type="module" src="js/list.js"></script>
</body>
</html>
