# Lint and tests for every push and pull request, and an unsigned Windows installer
# (the windows job). Nothing is released here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pages:
    name: Pages (lint, Node tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  rust:
    name: Rust (cargo test, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
        working-directory: src-tauri

  windows:
    # The Windows build: the Windows-only code (menus, paths, single-instance) compiles
    # and its tests pass, and an unsigned NSIS installer is kept as the run's artifact
    # (Actions > the run > Artifacts). Unsigned: SmartScreen asks first ("More info >
    # Run anyway") until Windows signing is set up.
    name: Windows (cargo test, NSIS installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: ukegeeks-studio-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
