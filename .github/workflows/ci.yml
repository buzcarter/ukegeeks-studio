# Lint and tests for every push and pull request. Nothing is built or released here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pages:
    name: Pages (lint, Node tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  rust:
    name: Rust (cargo test, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
        working-directory: src-tauri
